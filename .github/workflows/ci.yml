name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push makes an in-flight run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` runs the kit's prepare script, which builds it. That is
      # deliberate: a package whose prepare step fails is broken for anyone
      # installing it from git, and this catches that before they do.
      - run: npm ci

      # Playwright is not a dependency of this repo — a browser download is a
      # heavy thing to put on everyone who clones it — so the browser checks
      # skip out loud where it is missing. Here they must not skip, which is
      # the whole reason they are in the gate.
      #
      # WebKit as well as Chromium: two faults in one week were invisible to
      # Chromium and plain in Safari, so a Chromium-only pass is a pass in one
      # engine.
      - name: Browsers for the visual and mobile checks
        run: npm i -g playwright && npx playwright install --with-deps chromium webkit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      # Storybook is the source of truth for what the components look like,
      # which is only worth anything if it still builds. A story that has
      # drifted out of step with its component fails here rather than on
      # somebody's machine a month later.
      - name: Build Storybook
        run: npm run build-storybook --workspace packages/inline-chat-kit

      # The published surface is the dist directory, not the source. Packing
      # verifies the files list and the exports map actually resolve.
      - name: Verify the package can be packed
        run: npm pack --workspace packages/inline-chat-kit --dry-run
